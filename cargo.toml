[workspace]
members  = ["contract", "contract_milestone"]
resolver = "2"

# ── Release profile — Wasm optimisation ──────────────────────────────────────
# These flags produce the smallest, fastest Wasm binary for on-chain deployment:
#   opt-level = "z"       → size-optimised (smaller contract = lower upload fee)
#   overflow-checks = true → keep runtime overflow protection even in release
#   debug = false          → strip debug symbols from the Wasm
#   strip = "symbols"      → further reduce binary size
#   lto = true             → link-time optimisation across crates
#   codegen-units = 1      → single codegen unit for maximum LTO effectiveness
[profile.release]
opt-level       = "z"
overflow-checks = true
debug           = false
strip           = "symbols"
lto             = true
codegen-units   = 1
