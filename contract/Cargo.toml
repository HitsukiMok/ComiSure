[package]
name        = "comi_sure"
version     = "0.1.0"
edition     = "2021"
description = "Trustless USDC escrow for freelance digital art commissions on Stellar."
license     = "MIT"
repository  = "https://github.com/HitsukiMok/ComiSure"

[lib]
name       = "comi_sure"
crate-type = ["cdylib", "rlib"]
path       = "lib.rs"

[dependencies]
soroban-sdk = { version = "22.0.0" }

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }
